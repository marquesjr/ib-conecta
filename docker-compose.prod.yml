name: ib-conecta-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ibconecta}
      POSTGRES_USER: ${POSTGRES_USER:-ibconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  web:
    build: .
    restart: unless-stopped
    command: gunicorn --config /app/gunicorn.conf.py config.wsgi:application
    env_file:
      - .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      DJANGO_SEED_DEMO: "false"
      DJANGO_COLLECTSTATIC: "true"
      POSTGRES_HOST: db
      MEDIA_ROOT: /app/media
      PRIVATE_MEDIA_ROOT: /app/private_media
    volumes:
      - media_data:/app/media
      - private_media_data:/app/private_media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-acme@localhost}
      CADDY_TLS: "${CADDY_TLS-tls internal}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  private_media_data:
  caddy_data:
  caddy_config:
