services:
  localstack:
    image: localstack/localstack:4.7
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-2
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  localstack_data:
