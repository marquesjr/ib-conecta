{% extends "base.html" %}

{% block title %}Verificar 2FA — IB Conecta{% endblock %}
{% block share %}{% endblock %}

{% block content %}
  <section class="cms-page">
    <h1>Digite o código do autenticador</h1>
    <div class="panel">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="cta" type="submit">Confirmar</button>
      </form>
    </div>
  </section>
{% endblock %}
