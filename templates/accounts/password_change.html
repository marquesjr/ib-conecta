{% extends "base.html" %}

{% block title %}Trocar senha — Igreja Batista em Santa Leopoldina{% endblock %}
{% block share %}{% endblock %}

{% block content %}
  <section class="cms-page">
    <h1>Trocar senha</h1>
    <div class="panel">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="cta" type="submit">Salvar senha</button>
      </form>
      <p><a class="text-link back-link" href="{% url 'accounts:account_home' %}">{% include "public/_arrow.html" %} Voltar para minha conta</a></p>
    </div>
  </section>
{% endblock %}
