<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minha conta — IB Conecta</title>
  </head>
  <body>
    <main>
      <h1>Olá, {{ user.username }}</h1>
      <p>Perfil: {{ profile.get_role_display }}</p>
      {% if messages %}
        <ul>
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
      {% if can_manage_2fa %}
        <p><a href="{% url 'accounts:two_factor_setup' %}">Configurar autenticação em dois fatores</a></p>
      {% endif %}
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Sair</button>
      </form>
    </main>
  </body>
</html>
