{% extends "base.html" %}

{% block title %}Usuários — IB Conecta{% endblock %}
{% block share %}{% endblock %}

{% block content %}
  <section class="cms-page">
    <h1>Gestão de perfis</h1>
    <ul class="news-list">
      {% for item in users %}
        <li>
          <p>{{ item.username }} — {{ item.profile.get_role_display }}</p>
          <form method="post">
            {% csrf_token %}
            <input type="hidden" name="user_id" value="{{ item.id }}" />
            <select name="role">
              {% for value, label in roles %}
                <option value="{{ value }}" {% if item.profile.role == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
            <button class="cta" type="submit">Salvar</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
