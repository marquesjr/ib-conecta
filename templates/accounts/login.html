{% extends "base.html" %}

{% block title %}Entrar — IB Conecta{% endblock %}
{% block share %}{% endblock %}

{% block content %}
  <section class="cms-page">
    <h1>Entrar</h1>
    <div class="panel">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="cta" type="submit">Entrar</button>
      </form>
      <p><a href="{% url 'accounts:password_reset' %}">Esqueci minha senha</a></p>
    </div>
  </section>
{% endblock %}
