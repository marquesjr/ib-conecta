<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Nova senha — IB Conecta</title>
  </head>
  <body>
    <main>
      <h1>Definir nova senha</h1>
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Salvar senha</button>
        </form>
      {% else %}
        <p>O link de redefinição é inválido ou expirou.</p>
      {% endif %}
    </main>
  </body>
</html>
