{% extends "base.html" %}

{% block title %}Nova senha — IB Conecta{% endblock %}
{% block share %}{% endblock %}

{% block content %}
  <section class="cms-page">
    <h1>Definir nova senha</h1>
    <div class="panel">
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="cta" type="submit">Salvar senha</button>
        </form>
      {% else %}
        <p>O link de redefinição é inválido ou expirou.</p>
      {% endif %}
    </div>
  </section>
{% endblock %}
