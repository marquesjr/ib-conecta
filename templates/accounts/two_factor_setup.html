<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2FA — IB Conecta</title>
  </head>
  <body>
    <main>
      <h1>Autenticação em dois fatores</h1>
      {% if enabled %}
        <p>2FA já está ativo nesta conta.</p>
      {% else %}
        <p>Escaneie ou informe o segredo no app autenticador:</p>
        <p><code>{{ secret }}</code></p>
        <p><small>{{ provisioning_uri }}</small></p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit">Ativar 2FA</button>
        </form>
      {% endif %}
      <p><a href="{% url 'accounts:account_home' %}">Voltar</a></p>
    </main>
  </body>
</html>
