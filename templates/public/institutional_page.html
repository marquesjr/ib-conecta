{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block title %}{{ page.title }} — IB Conecta{% endblock %}

{% block content %}
  <article class="cms-page">
    <h1>{{ page.title }}</h1>
    {% if page.intro %}
      <p class="lede">{{ page.intro }}</p>
    {% endif %}
    <div class="rich-text">
      {{ page.body|richtext }}
    </div>
  </article>
{% endblock %}
