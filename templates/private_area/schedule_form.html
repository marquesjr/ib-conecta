{% extends "base.html" %}

{% block title %}Nova escala — {{ ministry.name }} — IB Conecta{% endblock %}

{% block share %}{% endblock %}

{% block content %}
  <section class="cms-page">
    <h1>Montar escala mensal</h1>
    <p class="lede">{{ ministry.name }}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="cta" type="submit">Criar escala</button>
    </form>
    <p><a href="{% url 'private_area:ministry_detail' ministry.pk %}">Voltar ao ministério</a></p>
  </section>
{% endblock %}
